# Herdr configuration migrated from ~/.tmux.conf.
# Unsupported tmux-only behavior is intentionally omitted.
onboarding = false

[theme]
# Ghostty is a truecolor terminal, so hex tokens are safe here. The previous
# "terminal" theme and its named-colors-only restriction existed solely to work
# around Terminal.app's lack of 24-bit color and are no longer needed.
#
# herdr ships rose-pine and rose-pine-dawn but not the Moon variant, so use
# rose-pine as the base and override the tokens that differ below.
name = "rose-pine"

[theme.custom]
# Rose Pine Moon, matching ~/.config/ghostty/config so herdr's chrome and the
# terminal background agree. Values taken from Ghostty's own theme file at
# /Applications/Ghostty.app/Contents/Resources/ghostty/themes/Rose Pine Moon.
#
# Moon's base is #232136. panel_bg intentionally sits one step above it at
# surface #2a273f so the tab bar reads as chrome rather than as pane content.
panel_bg    = "#2a273f"  # surface
surface0    = "#2a273f"  # surface
surface1    = "#393552"  # overlay
surface_dim = "#2a283e"  # highlight low
overlay0    = "#6e6a86"  # muted
overlay1    = "#908caa"  # subtle
text        = "#e0def4"  # text
subtext0    = "#908caa"  # subtle

# Accent colors follow Rose Pine's canonical ANSI mapping. Rose Pine has fewer
# hues than these Catppuccin-derived token names expect, so pine does double
# duty for green and teal.
accent = "#c4a7e7"  # iris
red    = "#eb6f92"  # love
green  = "#3e8fb0"  # pine
yellow = "#f6c177"  # gold
blue   = "#9ccfd8"  # foam
teal   = "#3e8fb0"  # pine
mauve  = "#c4a7e7"  # iris
peach  = "#ea9a97"  # rose

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "backtick"

# Preserve the existing tmux window and pane shortcuts.
new_tab = "prefix+c"
rename_tab = "prefix+shift+r"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+v"
split_vertical = "prefix+b"
zoom = "prefix+f"
close_pane = "prefix+w"

# Restores the old tmux prefix+u prompt search. Opens the pane's full scrollback
# in $EDITOR (nvim), where "?" searches backwards. herdr's default for this is
# prefix+e; moved to u to match existing muscle memory.
edit_scrollback = "prefix+u"

# Cycle spaces with tab. Herdr binds these keys to pane cycling by default, but
# panes are already reachable directly through prefix+hjkl, whereas spaces had
# no binding at all.
next_workspace = "prefix+tab"
previous_workspace = "prefix+shift+tab"

# Disable conflicting Herdr defaults. These keys belong to migrated actions
# above, or intentionally no longer paste the macOS clipboard.
reload_config = ""
workspace_picker = ""
toggle_sidebar = ""
previous_tab = ""
cycle_pane_next = ""
cycle_pane_previous = ""

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
tab_bar_position = "bottom"
accent = "#c4a7e7"  # iris

[advanced]
# tmux retained 50,000 lines. Herdr measures scrollback in bytes, so use a
# generous 50 MB cap per pane rather than silently retaining less history.
scrollback_limit_bytes = 50000000
